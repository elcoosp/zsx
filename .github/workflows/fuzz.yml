name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Fuzz iterations
        required: false
        default: "1000000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Cache zig-pkg
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            zig-pkg
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
      - name: Fuzz front-end
        run: zig build fuzz -Dfuzz-iterations=${{ github.event.inputs.iterations || '1000000' }} -Dfuzz-seed=0x${{ github.run_id }}
      - name: Upload failure corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: spec/fuzz/failures
